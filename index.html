<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>老娘領地 - 會員查詢系統</title>
  
  <style>
    /* ==================== 全域重置 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: -apple-system, 'PingFang TC', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif;
      background: #f5f0eb;
      min-height: 100vh;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    
    /* ==================== 主容器 ==================== */
    .container {
      max-width: 768px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
      padding: 20px 20px 28px;
      min-height: 95vh;
    }
    
    /* ==================== 頂部標題列 ==================== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid #f0ebe6;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .header-icon {
      font-size: 26px;
      line-height: 1;
    }
    
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #6b4c3b;
      letter-spacing: 1px;
    }
    
    .header-badge {
      background: #e8ddd0;
      color: #6b4c3b;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
    }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .staff-info {
      font-size: 13px;
      color: #8b7a6b;
      background: #f5f0eb;
      padding: 4px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .staff-info .name {
      font-weight: 600;
      color: #6b4c3b;
    }
    
    .logout-btn {
      padding: 8px 18px;
      background: #f0ebe6;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #6b5544;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .logout-btn:active {
      transform: scale(0.95);
      background: #e0d8d0;
    }
    
    /* ==================== 登入頁面 ==================== */
    .login-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      padding: 20px 0;
    }
    
    .login-page .login-logo {
      font-size: 56px;
      margin-bottom: 8px;
    }
    
    .login-page h2 {
      font-size: 26px;
      color: #6b4c3b;
      font-weight: 700;
    }
    
    .login-page .subtitle {
      color: #a08b7a;
      font-size: 15px;
      margin-bottom: 28px;
    }
    
    .login-form {
      width: 100%;
      max-width: 360px;
    }
    
    .login-form .form-group {
      margin-bottom: 14px;
    }
    
    .login-form label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #6b5544;
      margin-bottom: 4px;
    }
    
    .login-form input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e8e0d8;
      border-radius: 10px;
      font-size: 16px;
      background: #faf8f6;
      transition: border-color 0.2s;
      outline: none;
      color: #2d2a27;
    }
    
    .login-form input:focus {
      border-color: #b8957a;
      background: #ffffff;
    }
    
    .login-form .login-btn {
      width: 100%;
      padding: 14px;
      background: #8b6b4d;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }
    
    .login-form .login-btn:active {
      transform: scale(0.97);
      background: #6b4c3b;
    }
    
    .login-form .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .login-error {
      background: #fde8e8;
      color: #c0392b;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 14px;
      display: none;
    }
    
    .login-error.show {
      display: block;
    }
    
    /* ==================== 搜尋區 ==================== */
    .search-section {
      background: #faf8f6;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid #f0ebe6;
    }
    
    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .search-row .search-input {
      flex: 1;
      min-width: 120px;
    }
    
    .search-row .search-input label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #8b7a6b;
      margin-bottom: 2px;
    }
    
    .search-row .search-input input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e8e0d8;
      border-radius: 10px;
      font-size: 15px;
      background: #ffffff;
      outline: none;
      color: #2d2a27;
      transition: border-color 0.2s;
    }
    
    .search-row .search-input input:focus {
      border-color: #b8957a;
    }
    
    .search-btn-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    
    .search-btn {
      padding: 10px 24px;
      background: #8b6b4d;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      height: 44px;
      white-space: nowrap;
    }
    
    .search-btn:active {
      transform: scale(0.95);
      background: #6b4c3b;
    }
    
    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .clear-btn {
      padding: 10px 14px;
      background: #f0ebe6;
      color: #6b5544;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      height: 44px;
      transition: all 0.2s ease;
    }
    
    .clear-btn:active {
      transform: scale(0.95);
    }
    
    .search-result-info {
      font-size: 13px;
      color: #8b7a6b;
      margin-top: 8px;
      padding: 6px 10px;
      background: #f0ebe6;
      border-radius: 8px;
      display: none;
    }
    
    .search-result-info.show {
      display: block;
    }
    
    .search-result-info .count {
      font-weight: 600;
      color: #6b4c3b;
    }
    
    /* ==================== 會員列表（搜尋結果） ==================== */
    .member-list {
      margin-bottom: 14px;
    }
    
    .member-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #f0ebe6;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .member-list-item:active {
      transform: scale(0.98);
      background: #f5f0eb;
    }
    
    .member-list-item .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .member-list-item .info .name {
      font-size: 16px;
      font-weight: 600;
      color: #2d2a27;
    }
    
    .member-list-item .info .phone {
      font-size: 13px;
      color: #8b7a6b;
    }
    
    .member-list-item .info .meta {
      font-size: 12px;
      color: #a08b7a;
    }
    
    .member-list-item .arrow {
      font-size: 18px;
      color: #b8957a;
    }
    
    .no-result {
      text-align: center;
      padding: 30px 20px;
      color: #a08b7a;
    }
    
    .no-result .icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    
    /* ==================== 會員資訊卡片 ==================== */
    .member-card {
      background: #faf8f6;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid #f0ebe6;
      display: none;
    }
    
    .member-card.show {
      display: block;
    }
    
    .member-info-row {
      display: flex;
      padding: 5px 0;
      border-bottom: 1px solid #f0ebe6;
    }
    
    .member-info-row:last-child {
      border-bottom: none;
    }
    
    .member-label {
      width: 80px;
      color: #8b7a6b;
      font-size: 14px;
      font-weight: 500;
      flex-shrink: 0;
    }
    
    .member-value {
      flex: 1;
      color: #2d2a27;
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }
    
    /* ==================== Tab 導航 ==================== */
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    
    .tab-item {
      padding: 11px 4px;
      text-align: center;
      background: #f5f0eb;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #6b5544;
      cursor: pointer;
      transition: all 0.25s ease;
      border: 2px solid transparent;
      user-select: none;
    }
    
    .tab-item:active {
      transform: scale(0.95);
    }
    
    .tab-item.active {
      background: #8b6b4d;
      color: #ffffff;
      border-color: #8b6b4d;
      box-shadow: 0 3px 10px rgba(139, 107, 77, 0.2);
    }
    
    .tab-item .tab-icon {
      display: block;
      font-size: 18px;
      margin-bottom: 1px;
    }
    
    /* ==================== Tab 內容區 ==================== */
    .tab-content {
      background: #faf8f6;
      border-radius: 14px;
      padding: 14px 14px 18px;
      min-height: 250px;
      border: 1px solid #f0ebe6;
    }
    
    .tab-content .empty-state {
      text-align: center;
      padding: 30px 16px;
      color: #a08b7a;
    }
    
    .tab-content .empty-state .empty-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    
    /* ==================== 會員資料頁 ==================== */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    .profile-item {
      background: #ffffff;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #f0ebe6;
    }
    
    .profile-item .label {
      font-size: 11px;
      color: #a08b7a;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .profile-item .value {
      font-size: 17px;
      font-weight: 700;
      color: #2d2a27;
      margin-top: 3px;
    }
    
    .profile-item .value.points {
      color: #8b6b4d;
    }
    
    .profile-item.full-width {
      grid-column: 1 / -1;
    }
    
    /* ==================== 消費紀錄表格 ==================== */
    .record-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .record-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 420px;
    }
    
    .record-table th {
      text-align: left;
      padding: 8px 6px;
      color: #8b7a6b;
      font-weight: 600;
      border-bottom: 2px solid #e8e0d8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    .record-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #f0ebe6;
      color: #2d2a27;
      font-size: 13px;
    }
    
    .record-table tr:last-child td {
      border-bottom: none;
    }
    
    .record-table .amount {
      font-weight: 600;
      color: #6b4c3b;
    }
    
    .record-table .points-badge {
      background: #e8ddd0;
      color: #6b4c3b;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
    }
    
    /* ==================== 集點資料 ==================== */
    .points-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    
    .points-card {
      background: #ffffff;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #f0ebe6;
      text-align: center;
    }
    
    .points-card .number {
      font-size: 28px;
      font-weight: 700;
      color: #8b6b4d;
    }
    
    .points-card .label {
      font-size: 12px;
      color: #a08b7a;
      margin-top: 3px;
    }
    
    .points-bar-wrap {
      background: #ffffff;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #f0ebe6;
    }
    
    .points-bar-wrap .bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #6b5544;
      margin-bottom: 4px;
    }
    
    .points-bar {
      height: 6px;
      background: #f0ebe6;
      border-radius: 3px;
      overflow: hidden;
    }
    
    .points-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4a373, #8b6b4d);
      border-radius: 3px;
      transition: width 0.6s ease;
      width: 0%;
    }
    
    /* ==================== 優惠券 ==================== */
    .coupon-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .coupon-item {
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #f0ebe6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .coupon-item .coupon-name {
      font-weight: 600;
      color: #2d2a27;
      font-size: 14px;
    }
    
    .coupon-item .coupon-status {
      font-size: 12px;
      padding: 3px 12px;
      border-radius: 20px;
      font-weight: 500;
    }
    
    .coupon-item .coupon-status.available {
      background: #e8f5e9;
      color: #2e7d32;
    }
    
    .coupon-item .coupon-status.used {
      background: #f5f5f5;
      color: #888;
    }
    
    .coupon-item .coupon-status.expired {
      background: #fde8e8;
      color: #c0392b;
    }
    
    .coupon-item .coupon-expire {
      font-size: 11px;
      color: #a08b7a;
      width: 100%;
    }
    
    /* ==================== 載入動畫 ==================== */
    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 0;
    }
    
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #f0ebe6;
      border-top-color: #8b6b4d;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* ==================== 響應式 ==================== */
    @media (max-width: 600px) {
      body { padding: 8px; }
      .container { padding: 14px; border-radius: 16px; }
      
      .header h1 { font-size: 19px; }
      .header-icon { font-size: 22px; }
      .staff-info { font-size: 11px; padding: 3px 10px; }
      .logout-btn { padding: 6px 12px; font-size: 12px; }
      
      .search-row { flex-direction: column; gap: 8px; }
      .search-row .search-input { min-width: 100%; }
      .search-btn-wrap { width: 100%; }
      .search-btn { flex: 1; justify-content: center; }
      
      .tabs { grid-template-columns: repeat(2, 1fr); gap: 5px; }
      .tab-item { padding: 8px 4px; font-size: 12px; }
      .tab-item .tab-icon { font-size: 16px; }
      
      .profile-grid { grid-template-columns: 1fr; }
      .points-summary { grid-template-columns: 1fr 1fr; }
      
      .member-label { width: 65px; font-size: 12px; }
      .member-value { font-size: 14px; }
      
      .login-page h2 { font-size: 22px; }
      .login-form { max-width: 100%; }
      
      .record-table { font-size: 12px; min-width: 340px; }
      .record-table th, .record-table td { padding: 6px 4px; }
    }
    
    @media (max-width: 400px) {
      .container { padding: 10px; }
      .header h1 { font-size: 16px; }
      .header-badge { font-size: 9px; padding: 1px 8px; }
      .staff-info { font-size: 10px; padding: 2px 8px; }
      .logout-btn { padding: 4px 10px; font-size: 11px; }
      
      .points-summary { grid-template-columns: 1fr 1fr; gap: 6px; }
      .points-card .number { font-size: 22px; }
      .points-card { padding: 10px; }
    }
    
    @media (min-width: 769px) and (max-width: 1024px) and (orientation: landscape) {
      .container { max-width: 900px; padding: 24px 28px; }
      .profile-grid { grid-template-columns: repeat(3, 1fr); }
      .points-summary { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  
  <!-- ====== 頂部標題 ====== -->
  <div class="header">
    <div class="header-left">
      <span class="header-icon">🏠</span>
      <h1>老娘領地</h1>
      <span class="header-badge">查詢</span>
    </div>
    <div class="header-right">
      <span class="staff-info" id="staffInfo" style="display:none;">
        👤 <span class="name" id="staffName">-</span>
        <span id="staffBranch" style="color:#a08b7a;font-weight:400;"></span>
      </span>
      <button class="logout-btn" id="logoutBtn" style="display:none;">
        🚪 登出
      </button>
    </div>
  </div>
  
  <!-- ====== 登入頁面 ====== -->
  <div id="loginPage" class="login-page">
    <div class="login-logo">🏠</div>
    <h2>老娘領地</h2>
    <p class="subtitle">會員查詢系統</p>
    
    <div class="login-form">
      <div class="login-error" id="loginError"></div>
      
      <div class="form-group">
        <label>👤 登入帳號</label>
        <input type="text" id="loginAccount" placeholder="請輸入帳號" autocomplete="username">
      </div>
      
      <div class="form-group">
        <label>🔒 登入密碼</label>
        <input type="password" id="loginPassword" placeholder="請輸入密碼" autocomplete="current-password">
      </div>
      
      <button class="login-btn" id="loginBtn">登入</button>
    </div>
  </div>
  
  <!-- ====== 主要內容（登入後顯示） ====== -->
  <div id="mainContent" style="display:none;">
    
    <!-- ====== 搜尋區 ====== -->
    <div class="search-section">
      <div class="search-row">
        <div class="search-input">
          <label>👤 姓名</label>
          <input type="text" id="searchName" placeholder="輸入會員姓名" autocomplete="off">
        </div>
        <div class="search-input">
          <label>📱 電話</label>
          <input type="text" id="searchPhone" placeholder="輸入會員電話" autocomplete="off">
        </div>
        <div class="search-btn-wrap">
          <button class="search-btn" id="searchBtn">🔍 查詢</button>
          <button class="clear-btn" id="clearBtn">✕</button>
        </div>
      </div>
      <div class="search-result-info" id="searchResultInfo">
        找到 <span class="count" id="resultCount">0</span> 位會員
      </div>
    </div>
    
    <!-- ====== 會員列表（搜尋結果） ====== -->
    <div class="member-list" id="memberList"></div>
    
    <!-- ====== 會員資訊卡片 ====== -->
    <div class="member-card" id="memberCard">
      <div class="member-info-row">
        <span class="member-label">會員姓名</span>
        <span class="member-value" id="displayName">-</span>
      </div>
      <div class="member-info-row">
        <span class="member-label">會員電話</span>
        <span class="member-value" id="displayPhone">-</span>
      </div>
      <div class="member-info-row">
        <span class="member-label">會員等級</span>
        <span class="member-value" id="displayLevel">-</span>
      </div>
    </div>
    
    <!-- ====== Tab 導航 ====== -->
    <div class="tabs" id="tabNav">
      <div class="tab-item active" data-tab="profile">
        <span class="tab-icon">📋</span> 會員資料
      </div>
      <div class="tab-item" data-tab="records">
        <span class="tab-icon">🧾</span> 消費紀錄
      </div>
      <div class="tab-item" data-tab="points">
        <span class="tab-icon">⭐</span> 集點資料
      </div>
      <div class="tab-item" data-tab="coupons">
        <span class="tab-icon">🎫</span> 優惠券
      </div>
    </div>
    
    <!-- ====== Tab 內容 ====== -->
    <div class="tab-content" id="tabContent">
      <div class="empty-state">
        <span class="empty-icon">🔍</span>
        <p>請先搜尋會員</p>
      </div>
    </div>
    
  </div>
</div>

<script>
  // ================================================================
  //  全域設定
  // ================================================================
  
  // 🔧 請修改為您的 GAS 部署網址
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwUp92g3PDd62SFceEtlPYnzGejtcP3izzPdveC1rOQE8ml6MDwBe_c5q6VGPV8gbNs/exec';
  
  var currentMemberId = null;
  var currentMemberData = null;
  var currentTab = 'profile';
  var searchResults = [];
  
  // ================================================================
  //  DOM 參考
  // ================================================================
  
  var loginPage = document.getElementById('loginPage');
  var mainContent = document.getElementById('mainContent');
  var loginBtn = document.getElementById('loginBtn');
  var loginAccount = document.getElementById('loginAccount');
  var loginPassword = document.getElementById('loginPassword');
  var loginError = document.getElementById('loginError');
  var logoutBtn = document.getElementById('logoutBtn');
  var staffInfo = document.getElementById('staffInfo');
  var staffName = document.getElementById('staffName');
  var staffBranch = document.getElementById('staffBranch');
  
  var searchName = document.getElementById('searchName');
  var searchPhone = document.getElementById('searchPhone');
  var searchBtn = document.getElementById('searchBtn');
  var clearBtn = document.getElementById('clearBtn');
  var searchResultInfo = document.getElementById('searchResultInfo');
  var resultCount = document.getElementById('resultCount');
  var memberList = document.getElementById('memberList');
  
  var displayName = document.getElementById('displayName');
  var displayPhone = document.getElementById('displayPhone');
  var displayLevel = document.getElementById('displayLevel');
  var memberCard = document.getElementById('memberCard');
  var tabContent = document.getElementById('tabContent');
  var tabNav = document.getElementById('tabNav');
  
  // ================================================================
  //  登入功能
  // ================================================================
  
  function checkSession() {
    var session = sessionStorage.getItem('staffSession');
    if (session) {
      try {
        var data = JSON.parse(session);
        if (data.loginId && data.expireAt > Date.now()) {
          showMainContent(data);
          return true;
        } else {
          sessionStorage.removeItem('staffSession');
        }
      } catch(e) {
        sessionStorage.removeItem('staffSession');
      }
    }
    return false;
  }
  
  function doLogin() {
    var account = loginAccount.value.trim();
    var password = loginPassword.value.trim();
    
    if (!account || !password) {
      showLoginError('請輸入帳號和密碼');
      return;
    }
    
    loginBtn.disabled = true;
    loginBtn.textContent = '登入中...';
    hideLoginError();
    
    var url = GAS_URL + '?action=staffLogin&account=' + encodeURIComponent(account) + '&password=' + encodeURIComponent(password);
    
    fetch(url)
      .then(function(response) { return response.json(); })
      .then(function(result) {
        loginBtn.disabled = false;
        loginBtn.textContent = '登入';
        
        if (result.success) {
          var sessionData = {
            loginId: account,
            name: result.name,
            role: result.role,
            branch: result.branch,
            expireAt: Date.now() + 3600000
          };
          sessionStorage.setItem('staffSession', JSON.stringify(sessionData));
          showMainContent(sessionData);
        } else {
          showLoginError(result.message || '登入失敗');
        }
      })
      .catch(function(error) {
        loginBtn.disabled = false;
        loginBtn.textContent = '登入';
        showLoginError('網路連線錯誤，請稍後再試');
        console.error('Login error:', error);
      });
  }
  
  function showLoginError(msg) {
    loginError.textContent = msg;
    loginError.className = 'login-error show';
  }
  
  function hideLoginError() {
    loginError.className = 'login-error';
  }
  
  function showMainContent(sessionData) {
    loginPage.style.display = 'none';
    mainContent.style.display = 'block';
    logoutBtn.style.display = 'flex';
    staffInfo.style.display = 'flex';
    staffName.textContent = sessionData.name || '店員';
    staffBranch.textContent = sessionData.branch ? ' (' + sessionData.branch + ')' : '';
    
    // 顯示歡迎訊息
    showEmptyState('🔍', '請輸入姓名或電話搜尋會員');
  }
  
  // ================================================================
  //  登出功能
  // ================================================================
  
  function doLogout() {
    var session = sessionStorage.getItem('staffSession');
    if (session) {
      try {
        var data = JSON.parse(session);
        var url = GAS_URL + '?action=staffLogout&loginId=' + encodeURIComponent(data.loginId);
        fetch(url).catch(function() {});
      } catch(e) {}
    }
    
    sessionStorage.removeItem('staffSession');
    currentMemberId = null;
    currentMemberData = null;
    searchResults = [];
    
    loginPage.style.display = 'flex';
    mainContent.style.display = 'none';
    logoutBtn.style.display = 'none';
    staffInfo.style.display = 'none';
    loginAccount.value = '';
    loginPassword.value = '';
    hideLoginError();
  }
  
  // ================================================================
  //  搜尋會員
  // ================================================================
  
  function doSearch() {
    var name = searchName.value.trim();
    var phone = searchPhone.value.trim();
    
    if (!name && !phone) {
      showEmptyState('🔍', '請輸入姓名或電話');
      return;
    }
    
    searchBtn.disabled = true;
    searchBtn.textContent = '搜尋中...';
    memberList.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
    searchResultInfo.className = 'search-result-info';
    memberCard.className = 'member-card';
    currentMemberId = null;
    currentMemberData = null;
    
    var url = GAS_URL + '?action=searchMember&name=' + encodeURIComponent(name) + '&phone=' + encodeURIComponent(phone);
    
    fetch(url)
      .then(function(response) { return response.json(); })
      .then(function(result) {
        searchBtn.disabled = false;
        searchBtn.textContent = '🔍 查詢';
        
        if (result.success && result.members && result.members.length > 0) {
          searchResults = result.members;
          renderMemberList(result.members);
          resultCount.textContent = result.members.length;
          searchResultInfo.className = 'search-result-info show';
          
          // 自動選取第一筆
          selectMember(result.members[0]);
        } else {
          searchResults = [];
          memberList.innerHTML = '<div class="no-result"><span class="icon">😕</span><p>' + (result.message || '查無會員') + '</p></div>';
          searchResultInfo.className = 'search-result-info';
          memberCard.className = 'member-card';
          showEmptyState('🔍', '請重新搜尋');
        }
      })
      .catch(function(error) {
        searchBtn.disabled = false;
        searchBtn.textContent = '🔍 查詢';
        memberList.innerHTML = '<div class="no-result"><span class="icon">⚠️</span><p>網路連線錯誤</p></div>';
        console.error('Search error:', error);
      });
  }
  
  function renderMemberList(members) {
    var html = '';
    for (var i = 0; i < members.length; i++) {
      var m = members[i];
      html += '<div class="member-list-item" data-id="' + m.memberId + '" onclick="selectMemberById(\'' + m.memberId + '\')">';
      html += '<div class="info">';
      html += '<div class="name">' + (m.name || '-') + '</div>';
      html += '<div class="phone">📱 ' + (m.phone || '-') + '</div>';
      if (m.birthday) {
        html += '<div class="meta">🎂 ' + m.birthday + '</div>';
      }
      html += '</div>';
      html += '<span class="arrow">›</span>';
      html += '</div>';
    }
    memberList.innerHTML = html;
  }
  
  function selectMemberById(memberId) {
    for (var i = 0; i < searchResults.length; i++) {
      if (searchResults[i].memberId === memberId) {
        selectMember(searchResults[i]);
        break;
      }
    }
  }
  
  function selectMember(member) {
    currentMemberId = member.memberId;
    currentMemberData = member;
    
    // 更新卡片
    displayName.textContent = member.name || '-';
    displayPhone.textContent = member.phone || '-';
    displayLevel.textContent = member.level || '一般會員';
    memberCard.className = 'member-card show';
    
    // 載入詳細資料
    loadMemberDetail(member.memberId);
  }
  
  // ================================================================
  //  載入會員詳細資料
  // ================================================================
  
  function loadMemberDetail(memberId) {
    showLoading();
    
    var url = GAS_URL + '?action=getMemberDetail&memberId=' + encodeURIComponent(memberId);
    
    fetch(url)
      .then(function(response) { return response.json(); })
      .then(function(result) {
        if (result.success && result.data) {
          currentMemberData = result.data.memberData;
          renderTabContent(currentTab, result.data);
        } else {
          showEmptyState('📭', '無法載入會員資料');
        }
      })
      .catch(function(error) {
        console.error('Load detail error:', error);
        showEmptyState('⚠️', '載入失敗，請稍後再試');
      });
  }
  
  // ================================================================
  //  渲染：Tab 內容
  // ================================================================
  
  function renderTabContent(tab, data) {
    var container = tabContent;
    
    switch(tab) {
      case 'profile':
        renderProfile(container, data.memberData);
        break;
      case 'records':
        renderRecords(container, data.transactions);
        break;
      case 'points':
        renderPoints(container, data.pointSummary);
        break;
      case 'coupons':
        renderCoupons(container, data.coupons);
        break;
      default:
        container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>未知頁面</p></div>';
    }
  }
  
  // ---------- 會員資料 ----------
  function renderProfile(container, member) {
    if (!member) {
      container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>無會員資料</p></div>';
      return;
    }
    
    var html = '';
    html += '<div class="profile-grid">';
    
    var fields = [
      { label: '會員編號', value: member.memberId || '-' },
      { label: '會員姓名', value: member.name || '-' },
      { label: '會員電話', value: member.phone || '-' },
      { label: '🎂 生日', value: member.birthday || '未設定' },
      { label: '📅 最後消費', value: member.lastVisit || '無紀錄' },
      { label: '🏷️ 會員等級', value: member.level || '一般會員' },
      { label: '📊 總消費', value: '$' + Number(member.totalSpend || 0).toLocaleString() },
      { label: '⭐ 累積總點數', value: Number(member.totalPoints || 0).toLocaleString(), points: true },
    ];
    
    for (var i = 0; i < fields.length; i++) {
      var f = fields[i];
      var cls = 'profile-item';
      if (f.points) cls += ' points';
      html += '<div class="' + cls + '">';
      html += '<div class="label">' + f.label + '</div>';
      html += '<div class="value' + (f.points ? ' points' : '') + '">' + f.value + '</div>';
      html += '</div>';
    }
    
    html += '</div>';
    container.innerHTML = html;
  }
  
  // ---------- 消費紀錄 ----------
  function renderRecords(container, transactions) {
    if (!transactions || transactions.length === 0) {
      container.innerHTML = '<div class="empty-state"><span class="empty-icon">🧾</span><p>尚無消費紀錄</p></div>';
      return;
    }
    
    var html = '';
    html += '<div class="record-table-wrap">';
    html += '<table class="record-table">';
    html += '<thead><tr>';
    html += '<th>日期</th>';
    html += '<th>分店</th>';
    html += '<th>類別</th>';
    html += '<th>金額</th>';
    html += '<th>點數</th>';
    html += '</tr></thead>';
    html += '<tbody>';
    
    for (var i = 0; i < transactions.length; i++) {
      var t = transactions[i];
      var dateStr = t.date ? formatDateDisplay(t.date) : '-';
      html += '<tr>';
      html += '<td>' + dateStr + '</td>';
      html += '<td>' + (t.branch || '-') + '</td>';
      html += '<td>' + (t.category || '-') + '</td>';
      html += '<td class="amount">$' + Number(t.actual || 0).toLocaleString() + '</td>';
      html += '<td><span class="points-badge">+' + Number(t.points || 0).toLocaleString() + '</span></td>';
      html += '</tr>';
    }
    
    html += '</tbody></table>';
    html += '</div>';
    container.innerHTML = html;
  }
  
  // ---------- 集點資料 ----------
  function renderPoints(container, summary) {
    if (!summary) {
      container.innerHTML = '<div class="empty-state"><span class="empty-icon">⭐</span><p>無集點資料</p></div>';
      return;
    }
    
    var total = Number(summary.totalPoints || 0);
    var current = Number(summary.currentPoints || 0);
    var personal = Number(summary.personalPoints || 0);
    var referral = Number(summary.referralPoints || 0);
    
    var percent = total > 0 ? Math.min((current / total) * 100, 100) : 0;
    
    var html = '';
    
    html += '<div class="points-summary">';
    
    var items = [
      { label: '累積總點數', value: total.toLocaleString() },
      { label: '目前剩餘點', value: current.toLocaleString() },
      { label: '個人點數', value: personal.toLocaleString() },
      { label: '推薦點數', value: referral.toLocaleString() },
    ];
    
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      html += '<div class="points-card">';
      html += '<div class="number">' + item.value + '</div>';
      html += '<div class="label">' + item.label + '</div>';
      html += '</div>';
    }
    
    html += '</div>';
    
    html += '<div class="points-bar-wrap">';
    html += '<div class="bar-label">';
    html += '<span>已使用點數</span>';
    html += '<span>' + Math.round(percent) + '%</span>';
    html += '</div>';
    html += '<div class="points-bar">';
    html += '<div class="points-bar-fill" style="width:' + percent + '%;"></div>';
    html += '</div>';
    html += '</div>';
    
    container.innerHTML = html;
  }
  
  // ---------- 優惠券 ----------
  function renderCoupons(container, coupons) {
    if (!coupons || coupons.length === 0) {
      container.innerHTML = '<div class="empty-state"><span class="empty-icon">🎫</span><p>尚無優惠券</p></div>';
      return;
    }
    
    var html = '';
    html += '<div class="coupon-list">';
    
    for (var i = 0; i < coupons.length; i++) {
      var c = coupons[i];
      var statusClass = 'available';
      var statusText = '可使用';
      
      if (c.status === '已使用' || c.status === 'used') {
        statusClass = 'used';
        statusText = '已使用';
      } else if (c.status === '已過期' || c.status === 'expired') {
        statusClass = 'expired';
        statusText = '已過期';
      }
      
      html += '<div class="coupon-item">';
      html += '<div>';
      html += '<div class="coupon-name">' + (c.name || '優惠券') + '</div>';
      if (c.expireDate) {
        html += '<div class="coupon-expire">⏰ 到期日：' + formatDateDisplay(c.expireDate) + '</div>';
      }
      html += '</div>';
      html += '<span class="coupon-status ' + statusClass + '">' + statusText + '</span>';
      html += '</div>';
    }
    
    html += '</div>';
    container.innerHTML = html;
  }
  
  // ================================================================
  //  輔助函數
  // ================================================================
  
  function showLoading() {
    tabContent.innerHTML = '<div class="loading-spinner"><div class="spinner"></div></div>';
  }
  
  function showEmptyState(icon, msg) {
    tabContent.innerHTML = '<div class="empty-state"><span class="empty-icon">' + (icon || '📭') + '</span><p>' + (msg || '請先搜尋會員') + '</p></div>';
  }
  
  function formatDateDisplay(dateStr) {
    if (!dateStr) return '-';
    try {
      var d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      var year = d.getFullYear();
      var month = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return year + '/' + month + '/' + day;
    } catch(e) {
      return dateStr;
    }
  }
  
  // ================================================================
  //  Tab 切換
  // ================================================================
  
  tabNav.addEventListener('click', function(e) {
    var tabItem = e.target.closest('.tab-item');
    if (!tabItem) return;
    
    var tab = tabItem.dataset.tab;
    if (!tab) return;
    
    var allTabs = tabNav.querySelectorAll('.tab-item');
    for (var i = 0; i < allTabs.length; i++) {
      allTabs[i].classList.remove('active');
    }
    tabItem.classList.add('active');
    
    currentTab = tab;
    
    if (currentMemberId) {
      loadMemberDetail(currentMemberId);
    } else {
      showEmptyState('🔍', '請先搜尋會員');
    }
  });
  
  // ================================================================
  //  清空搜尋
  // ================================================================
  
  function clearSearch() {
    searchName.value = '';
    searchPhone.value = '';
    searchResults = [];
    currentMemberId = null;
    currentMemberData = null;
    memberList.innerHTML = '';
    searchResultInfo.className = 'search-result-info';
    memberCard.className = 'member-card';
    showEmptyState('🔍', '請輸入姓名或電話搜尋會員');
  }
  
  // ================================================================
  //  事件綁定
  // ================================================================
  
  loginBtn.addEventListener('click', doLogin);
  
  loginAccount.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loginPassword.focus();
  });
  
  loginPassword.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  
  logoutBtn.addEventListener('click', doLogout);
  
  searchBtn.addEventListener('click', doSearch);
  
  clearBtn.addEventListener('click', clearSearch);
  
  searchName.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });
  
  searchPhone.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
  });
  
  // ================================================================
  //  初始化
  // ================================================================
  
  if (!checkSession()) {
    loginPage.style.display = 'flex';
    mainContent.style.display = 'none';
    logoutBtn.style.display = 'none';
    staffInfo.style.display = 'none';
  }
  
  console.log('🏠 老娘領地 會員查詢系統 v1.1');
  console.log('📌 GAS URL:', GAS_URL);
</script>

</body>
</html>
